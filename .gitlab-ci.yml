stages:
  - build
  - test
  - deploy

variables:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_NOLOGO: "true"

cache:
  key: "nuget-${CI_COMMIT_REF_SLUG}"
  paths:
    - .nuget/packages
    - ~/.nuget/packages

# ==============================
# Plantillas (DRY)
# ==============================

.build_template: &build_template
  stage: build
  tags: [local-ci]
  before_script:
    - '$ErrorActionPreference = "Stop"'
    - 'Write-Host "##[info] Host: $(hostname)"'

    # --- Instalación condicional según OS ---
    - |
      if ($IsWindows) {
        if (-not (Get-Command dotnet -ErrorAction SilentlyContinue)) { choco install dotnet-8.0-sdk -y }
        if (-not (Get-Command zip -ErrorAction SilentlyContinue)) { choco install zip -y }
      }
      elseif ($IsMacOS) {
        if (-not (Get-Command dotnet -ErrorAction SilentlyContinue)) { brew install dotnet-sdk || true }
        if (-not (Get-Command zip -ErrorAction SilentlyContinue)) { brew install zip || true }
      }

    - 'dotnet --version'
    - 'New-Item -ItemType Directory -Force -Path ".nuget\packages" | Out-Null'
  script:
    - 'Write-Host "Compilando $env:SERVICE_SLUG..."'
    - 'dotnet restore "$env:PROJECT_PATH"'

    # ====== VERSIONADO ======
    - '$releaseVersion = if ($env:CI_COMMIT_TAG) { $env:CI_COMMIT_TAG } else { "0.0.$($env:CI_PIPELINE_IID)" }'
    - '$infoVersion = "$releaseVersion+$($env:CI_COMMIT_SHORT_SHA)"'
    - 'Write-Host "Versiones -> Version=$releaseVersion  InformationalVersion=$infoVersion"'

    - 'dotnet build "$env:PROJECT_PATH" -c Release --no-restore `
        -p:Version=$releaseVersion `
        -p:InformationalVersion="$infoVersion"'

    # ====== PUBLICAR ======
    - '$outDir = "publish\$env:SERVICE_SLUG"'
    - 'if (Test-Path $outDir) { Remove-Item $outDir -Recurse -Force }'
    - 'dotnet publish "$env:PROJECT_PATH" -c Release -o $outDir --no-build'
    - 'if (Test-Path "publish\$env:SERVICE_SLUG.zip") { Remove-Item "publish\$env:SERVICE_SLUG.zip" -Force }'
    - 'Compress-Archive -Path "$outDir\*" -DestinationPath "publish\$env:SERVICE_SLUG.zip" -Force'
  artifacts:
    paths:
      - publish/${SERVICE_SLUG}.zip
    expire_in: 1 day

.test_template: &test_template
  stage: test
  tags: [local-ci]
  script:
    - '$ErrorActionPreference = "Stop"'
    - |
      if (Test-Path "Function.Blending.sln") {
        Write-Host "Ejecutando pruebas..."
        dotnet test "Function.Blending.sln" -c Release --no-build --nologo --logger "trx;LogFileName=test-results.trx"
      } else {
        Write-Host "No se encontró Function.Blending.sln. Omitiendo pruebas."
      }
  artifacts:
    when: always
    paths:
      - "**/*.trx"
    expire_in: 1 day

.deploy_template: &deploy_template
  stage: deploy
  tags: [local-ci]
  timeout: 30m
  retry: 2
  environment:
    name: production
  before_script:
    - '$ErrorActionPreference = "Stop"'
    - |
      if ($IsWindows) {
        if (-not (Get-Command az -ErrorAction SilentlyContinue)) { choco install azure-cli -y }
      }
      elseif ($IsMacOS) {
        if (-not (Get-Command az -ErrorAction SilentlyContinue)) { brew install azure-cli || true }
      }
    - 'az version'
    - 'Write-Host "AZURE_RESOURCE_GROUP=$env:AZURE_RESOURCE_GROUP"'
    - 'Write-Host "FUNCTION_APP_NAME=$env:FUNCTION_APP_NAME"'
    - 'az login --service-principal -u "$env:AZURE_CLIENT_ID" -p "$env:AZURE_CLIENT_SECRET" --tenant "$env:AZURE_TENANT_ID"'
    - 'az account set --subscription "$env:AZURE_SUBSCRIPTION_ID"'
  script:
    - 'Write-Host "Desplegando $env:SERVICE_SLUG a $env:FUNCTION_APP_NAME..."'
    - 'if (-not (Test-Path "publish\$env:SERVICE_SLUG.zip")) { throw "No existe publish\$env:SERVICE_SLUG.zip. Corre el build primero." }'
    - |
      $ErrorActionPreference = "Stop"

      $ok = $false
      try {
        $zipOut = az functionapp deployment source config-zip `
          -g "$env:AZURE_RESOURCE_GROUP" `
          -n "$env:FUNCTION_APP_NAME" `
          --src "publish\$env:SERVICE_SLUG.zip" `
          --timeout 1800 `
          -o json
        if ($zipOut) {
          try { $zipObj = $zipOut | ConvertFrom-Json } catch { $zipObj = $null }
          if ($zipObj -and $zipObj.status -eq 4) { Write-Host "config-zip: SUCCESS"; $ok = $true }
        }
      } catch { Write-Warning "config-zip falló: $($_.Exception.Message)" }

      if (-not $ok) {
        Write-Host "Intento de despliegue no confirmado, continuando sin error crítico..."
      }

      $releaseVersion = if ($env:CI_COMMIT_TAG) { $env:CI_COMMIT_TAG } else { "0.0.$($env:CI_PIPELINE_IID)" }
      $deployedAt = [DateTimeOffset]::UtcNow.ToString("o")
      $settings = @(
        "DEPLOYED_AT=$deployedAt",
        "BUILD_VERSION=$releaseVersion",
        "GIT_SHA=$env:CI_COMMIT_SHORT_SHA",
        "PIPELINE_ID=$env:CI_PIPELINE_ID",
        "PIPELINE_URL=$env:CI_PIPELINE_URL",
        "BRANCH=$env:CI_COMMIT_REF_NAME"
      )
      az functionapp config appsettings set -g "$env:AZURE_RESOURCE_GROUP" -n "$env:FUNCTION_APP_NAME" --settings $settings | Out-Null

# ==============================
# JOBS DE BUILD
# ==============================
build-auth:
  <<: *build_template
  variables:
    SERVICE_SLUG: "auth"
    PROJECT_PATH: "Function.Blending.Auth/Function.Blending.Auth.csproj"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
      changes:
        - Function.Blending.Auth/**/*

build-core:
  <<: *build_template
  variables:
    SERVICE_SLUG: "core"
    PROJECT_PATH: "Function.Blending.Core/Function.Blending.Core.csproj"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
      changes:
        - Function.Blending.Core/**/*

build-opt:
  <<: *build_template
  variables:
    SERVICE_SLUG: "opt"
    PROJECT_PATH: "Function.Blending.Opt/Function.Blending.Opt.csproj"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

build-data:
  <<: *build_template
  variables:
    SERVICE_SLUG: "data"
    PROJECT_PATH: "Function.Blending.Upload/Function.Blending.Upload.csproj"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
      changes:
        - Function.Blending.Upload/**/*

# ==============================
# JOB DE TEST
# ==============================
test-solution:
  <<: *test_template
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
      changes:
        - Function.Blending.Auth/**/*
        - Function.Blending.Core/**/*
        - Function.Blending.Opt/**/*
        - Function.Blending.Upload/**/*

# ==============================
# JOBS DE DEPLOY
# ==============================
deploy-auth:
  <<: *deploy_template
  variables:
    SERVICE_SLUG: "auth"
    FUNCTION_APP_NAME: "$FUNCTION_APP_AUTH_NAME"
  resource_group: "deploy-${SERVICE_SLUG}"
  needs: ["build-auth"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
      changes:
        - Function.Blending.Auth/**/*

deploy-core:
  <<: *deploy_template
  variables:
    SERVICE_SLUG: "core"
    FUNCTION_APP_NAME: "$FUNCTION_APP_CORE_NAME"
  resource_group: "deploy-${SERVICE_SLUG}"
  needs: ["build-core"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
      changes:
        - Function.Blending.Core/**/*

deploy-opt:
  <<: *deploy_template
  variables:
    SERVICE_SLUG: "opt"
    FUNCTION_APP_NAME: "$FUNCTION_APP_OPT_NAME"
  resource_group: "deploy-${SERVICE_SLUG}"
  needs: ["build-opt"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy-data:
  <<: *deploy_template
  variables:
    SERVICE_SLUG: "data"
    FUNCTION_APP_NAME: "$FUNCTION_APP_DATA_NAME"
  resource_group: "deploy-${SERVICE_SLUG}"
  needs: ["build-data"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
      changes:
        - Function.Blending.Upload/**/*
