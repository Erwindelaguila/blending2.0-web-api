stages:
  - build
  - test
  - deploy

variables:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_NOLOGO: "true"

cache:
  key: "nuget-${CI_COMMIT_REF_SLUG}"
  paths:
    - .nuget/packages
    - ~/.nuget/packages

# ==============================
# Plantillas (DRY)
# ==============================

.build_template: &build_template
  stage: build
  tags: [local-ci]  # tu runner Windows debe tener este tag
  before_script:
    - '$ErrorActionPreference = "Stop"'
    - 'Write-Host "##[info] Host: $(hostname)"'
    - 'if (-not (Get-Command dotnet -ErrorAction SilentlyContinue)) { choco install dotnet-8.0-sdk -y }'
    - 'if (-not (Get-Command zip    -ErrorAction SilentlyContinue)) { choco install zip -y }'
    - 'dotnet --version'
    - 'New-Item -ItemType Directory -Force -Path ".nuget\packages" | Out-Null'
  script:
    - 'Write-Host "Compilando $env:SERVICE_SLUG..."'
    - 'dotnet restore "$env:PROJECT_PATH"'

    # ====== VERSIONADO DEL ASSEMBLY ======
    # Si hay tag -> usa el tag; si no -> 0.0.<pipeline_iid>  (queda en AssemblyVersion)
    - '$releaseVersion = if ($env:CI_COMMIT_TAG) { $env:CI_COMMIT_TAG } else { "0.0.$($env:CI_PIPELINE_IID)" }'
    # InformationalVersion incluye el short SHA (visible en tu /health)
    - '$infoVersion = "$releaseVersion+$($env:CI_COMMIT_SHORT_SHA)"'
    - 'Write-Host "Versiones -> Version=$releaseVersion  InformationalVersion=$infoVersion"'

    # Build con propiedades de versión (publish hará --no-build)
    - 'dotnet build "$env:PROJECT_PATH" -c Release --no-restore `
        -p:Version=$releaseVersion `
        -p:InformationalVersion="$infoVersion"'

    # Empaquetado
    - '$outDir = "publish\$env:SERVICE_SLUG"'
    - 'if (Test-Path $outDir) { Remove-Item $outDir -Recurse -Force }'
    - 'dotnet publish "$env:PROJECT_PATH" -c Release -o $outDir --no-build'
    - 'if (Test-Path "publish\$env:SERVICE_SLUG.zip") { Remove-Item "publish\$env:SERVICE_SLUG.zip" -Force }'
    - 'Compress-Archive -Path "$outDir\*" -DestinationPath "publish\$env:SERVICE_SLUG.zip" -Force'
  artifacts:
    paths:
      - publish/${SERVICE_SLUG}.zip
    expire_in: 1 day

.test_template: &test_template
  stage: test
  tags: [local-ci]
  script:
    - '$ErrorActionPreference = "Stop"'
    - |
      if (Test-Path "Function.Blending.sln") {
        Write-Host "Ejecutando pruebas..."
        dotnet test "Function.Blending.sln" -c Release --no-build --nologo --logger "trx;LogFileName=test-results.trx"
      } else {
        Write-Host "No se encontró Function.Blending.sln. Omitiendo pruebas."
      }
  artifacts:
    when: always
    paths:
      - "**/*.trx"
    expire_in: 1 day

.deploy_template: &deploy_template
  stage: deploy
  tags: [local-ci]
  timeout: 30m
  retry: 2
  environment:
    name: production
  before_script:
    - '$ErrorActionPreference = "Stop"'
    - 'if (-not (Get-Command az -ErrorAction SilentlyContinue)) { choco install azure-cli -y }'
    - 'az version'
    - 'Write-Host "AZURE_RESOURCE_GROUP=$env:AZURE_RESOURCE_GROUP"'
    - 'Write-Host "FUNCTION_APP_NAME=$env:FUNCTION_APP_NAME"'
    - 'az login --service-principal -u "$env:AZURE_CLIENT_ID" -p "$env:AZURE_CLIENT_SECRET" --tenant "$env:AZURE_TENANT_ID"'
    - 'az account set --subscription "$env:AZURE_SUBSCRIPTION_ID"'
  script:
    - 'Write-Host "Desplegando $env:SERVICE_SLUG a $env:FUNCTION_APP_NAME..."'
    - 'if (-not (Test-Path "publish\$env:SERVICE_SLUG.zip")) { throw "No existe publish\$env:SERVICE_SLUG.zip. Corre el build primero." }'
    # === TODO EL RESTO EN UN SOLO BLOQUE ===
    - | 
      try {
        az functionapp deployment source config-zip `
          -g "$env:AZURE_RESOURCE_GROUP" `
          -n "$env:FUNCTION_APP_NAME" `
          --src "publish\$env:SERVICE_SLUG.zip" `
          --timeout 1800
      } catch {
        Write-Warning "config-zip lanzó error (posible 504). Verificamos estado real en Kudu..."
      }

      # ---- Poll Kudu hasta 10 min ----
      $kudu = "https://$env:FUNCTION_APP_NAME.scm.azurewebsites.net/api/deployments/latest"
      $xml  = [xml](az functionapp deployment list-publishing-profiles -g "$env:AZURE_RESOURCE_GROUP" -n "$env:FUNCTION_APP_NAME" --xml)
      $pp   = $xml.publishData.publishProfile | Where-Object { $_.publishMethod -eq "MSDeploy" } | Select-Object -First 1
      if (-not $pp) { $pp = $xml.publishData.publishProfile | Select-Object -First 1 }
      $pair = "$($pp.userName):$($pp.userPWD)"
      $auth = "Basic " + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($pair))

      $ok = $false
      for ($i=1; $i -le 120; $i++) {   # 120 * 5s = 10 minutos
        try {
          $d = Invoke-RestMethod -Uri $kudu -Headers @{ Authorization = $auth } -TimeoutSec 30 -ErrorAction Stop
        } catch {
          Start-Sleep 5
          continue
        }
        if ($d.status -eq 4) { Write-Host "Kudu: Deploy SUCCESS"; $ok = $true; break }
        elseif ($d.status -eq 3) { throw "Kudu: Deploy FAILED - $($d.message)" }
        else { Write-Host ("Kudu: Status={0} (esperando)..." -f $d.status); Start-Sleep 5 }
      }
      if (-not $ok) { throw "Deploy no confirmado por Kudu tras 10 minutos." }

      # ---- App Settings para /health ----
      $releaseVersion = if ($env:CI_COMMIT_TAG) { $env:CI_COMMIT_TAG } else { "0.0.$($env:CI_PIPELINE_IID)" }
      $deployedAt = [DateTimeOffset]::UtcNow.ToString("o")
      $settings = @(
        "DEPLOYED_AT=$deployedAt",
        "BUILD_VERSION=$releaseVersion",
        "GIT_SHA=$env:CI_COMMIT_SHORT_SHA",
        "PIPELINE_ID=$env:CI_PIPELINE_ID",
        "PIPELINE_URL=$env:CI_PIPELINE_URL",
        "BRANCH=$env:CI_COMMIT_REF_NAME"
      )
      if ($env:HEALTHCHECK_INCLUDE_DEPLOY_INFO -and $env:HEALTHCHECK_INCLUDE_DEPLOY_INFO.Trim() -ne "") {
        $settings += "HEALTHCHECK_INCLUDE_DEPLOY_INFO=$env:HEALTHCHECK_INCLUDE_DEPLOY_INFO"
      }

      if (-not $env:AZURE_RESOURCE_GROUP) { throw "AZURE_RESOURCE_GROUP no está definida" }
      if (-not $env:FUNCTION_APP_NAME)     { throw "FUNCTION_APP_NAME no está definida" }

      az functionapp config appsettings set `
        -g "$env:AZURE_RESOURCE_GROUP" `
        -n "$env:FUNCTION_APP_NAME" `
        --settings $settings | Out-Null

# ==============================
# Jobs de BUILD
# ==============================
build-auth:
  <<: *build_template
  variables:
    SERVICE_SLUG: "auth"
    PROJECT_PATH: "Function.Blending.Auth/Function.Blending.Auth.csproj"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
      changes:
        - Function.Blending.Auth/**/*

build-core:
  <<: *build_template
  variables:
    SERVICE_SLUG: "core"
    PROJECT_PATH: "Function.Blending.Core/Function.Blending.Core.csproj"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
      changes:
        - Function.Blending.Core/**/*

build-opt:
  <<: *build_template
  variables:
    SERVICE_SLUG: "opt"
    PROJECT_PATH: "Function.Blending.Opt/Function.Blending.Opt.csproj"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      # changes:
      #   - Function.Blending.Opt/**/*

build-data:
  <<: *build_template
  variables:
    SERVICE_SLUG: "data"
    PROJECT_PATH: "Function.Blending.Upload/Function.Blending.Upload.csproj"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
      changes:
        - Function.Blending.Upload/**/*

# ==============================
# Job de TEST (opcional, corre si hay solución)
# ==============================
test-solution:
  <<: *test_template
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
      changes:
        - Function.Blending.Auth/**/*
        - Function.Blending.Core/**/*
        - Function.Blending.Opt/**/*
        - Function.Blending.Upload/**/*

# ==============================
# Jobs de DEPLOY
# ==============================
deploy-auth:
  <<: *deploy_template
  variables:
    SERVICE_SLUG: "auth"
    FUNCTION_APP_NAME: "$FUNCTION_APP_AUTH_NAME"
  resource_group: "deploy-${SERVICE_SLUG}"
  needs: ["build-auth"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
      changes:
        - Function.Blending.Auth/**/*

deploy-core:
  <<: *deploy_template
  variables:
    SERVICE_SLUG: "core"
    FUNCTION_APP_NAME: "$FUNCTION_APP_CORE_NAME"
  resource_group: "deploy-${SERVICE_SLUG}"
  needs: ["build-core"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
      changes:
        - Function.Blending.Core/**/*

deploy-opt:
  <<: *deploy_template
  variables:
    SERVICE_SLUG: "opt"
    FUNCTION_APP_NAME: "$FUNCTION_APP_OPT_NAME"
  resource_group: "deploy-${SERVICE_SLUG}"
  needs: ["build-opt"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      # when: manual
      # changes:
      #   - Function.Blending.Opt/**/*

deploy-data:
  <<: *deploy_template
  variables:
    SERVICE_SLUG: "data"
    FUNCTION_APP_NAME: "$FUNCTION_APP_DATA_NAME"
  resource_group: "deploy-${SERVICE_SLUG}"
  needs: ["build-data"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
      changes:
        - Function.Blending.Upload/**/*
 