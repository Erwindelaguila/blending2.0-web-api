stages: [build, test, deploy]

variables:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

cache:
  key: "nuget-${CI_COMMIT_REF_SLUG}"
  paths:
    - .nuget/packages
    - ~/.nuget/packages

# =========================================================
# Plantillas WINDOWS (usa PowerShell). Un solo tag.
# Si quieres correr en Mac, cambia los 3 "tags: [windows]" a "tags: [mac-runner-local]" y ajusta el before_script de deploy para instalar az con brew.
# =========================================================

.build_win: &build_win
  stage: build
  tags: [windows]
  before_script:
    - '$ErrorActionPreference = "Stop"'
    - 'Write-Host "##[info] Host: $(hostname)"'
    - 'dotnet --info'
    - 'New-Item -ItemType Directory -Force -Path ".nuget\packages" | Out-Null'
  script:
    - 'Write-Host "##[info] Compilando $env:SERVICE_SLUG..."'
    - 'dotnet restore "$env:PROJECT_PATH"'
    - 'dotnet build   "$env:PROJECT_PATH" -c Release --no-restore'
    - '$outDir = "publish\$env:SERVICE_SLUG"; if (Test-Path $outDir) { Remove-Item $outDir -Recurse -Force }'
    - 'dotnet publish "$env:PROJECT_PATH" -c Release -o $outDir --no-build'
    - 'if (Test-Path "publish\$env:SERVICE_SLUG.zip") { Remove-Item "publish\$env:SERVICE_SLUG.zip" -Force }'
    - 'Compress-Archive -Path "$outDir\*" -DestinationPath "publish\$env:SERVICE_SLUG.zip" -Force'
  artifacts:
    paths: [ "publish/${SERVICE_SLUG}.zip" ]
    expire_in: 3 days

.test_win: &test_win
  stage: test
  tags: [windows]
  before_script:
    - '$ErrorActionPreference = "Stop"'
    - 'dotnet --info'
  script:
    - |
      if (Test-Path "Function.Blending.sln") {
        dotnet test "Function.Blending.sln" -c Release --no-build --logger "trx;LogFileName=test-results.trx"
      } else {
        Write-Host "##[warn] No se encontró Function.Blending.sln — omitiendo tests."
      }
  artifacts:
    when: always
    paths: [ "**/*.trx" ]
    expire_in: 3 days

.deploy_win: &deploy_win
  stage: deploy
  tags: [windows]
  timeout: 30m
  before_script:
    - '$ErrorActionPreference = "Stop"'
    - 'if (-not (Get-Command az -ErrorAction SilentlyContinue)) { Write-Host "Instalando Azure CLI con winget..."; winget install --id Microsoft.AzureCLI -e --accept-package-agreements --accept-source-agreements }'
    - 'az version'
    - 'az login --service-principal -u "$env:AZURE_CLIENT_ID" -p "$env:AZURE_CLIENT_SECRET" --tenant "$env:AZURE_TENANT_ID"'
    - 'az account set --subscription "$env:AZURE_SUBSCRIPTION_ID"'
  script:
    - 'if (-not (Test-Path "publish\$env:SERVICE_SLUG.zip")) { throw "publish\$env:SERVICE_SLUG.zip no existe. Ejecuta el build." }'
    - 'Write-Host "##[info] Desplegando $env:SERVICE_SLUG a $env:FUNCTION_APP_NAME..."'
    - 'az functionapp deployment source config-zip -g "$env:AZURE_RESOURCE_GROUP" -n "$env:FUNCTION_APP_NAME" --src "publish\$env:SERVICE_SLUG.zip" --timeout 1800'

# =========================================================
# BUILD — SOLO se crean si cambian archivos de esa Function
# =========================================================

build-auth:
  <<: *build_win
  variables: { SERVICE_SLUG: "auth", PROJECT_PATH: "Function.Blending.Auth/Function.Blending.Auth.csproj" }
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [ "Function.Blending.Auth/**/*" ]

build-core:
  <<: *build_win
  variables: { SERVICE_SLUG: "core", PROJECT_PATH: "Function.Blending.Core/Function.Blending.Core.csproj" }
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [ "Function.Blending.Core/**/*" ]

build-opt:
  <<: *build_win
  variables: { SERVICE_SLUG: "opt", PROJECT_PATH: "Function.Blending.Opt/Function.Blending.Opt.csproj" }
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [ "Function.Blending.Opt/**/*" ]

build-data:
  <<: *build_win
  variables: { SERVICE_SLUG: "data", PROJECT_PATH: "Function.Blending.Upload/Function.Blending.Upload.csproj" }
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [ "Function.Blending.Upload/**/*" ]

# =========================================================
# TEST — corre si hay cambios en cualquiera de las 4
# =========================================================

test-solution:
  <<: *test_win
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - "Function.Blending.Auth/**/*"
        - "Function.Blending.Core/**/*"
        - "Function.Blending.Opt/**/*"
        - "Function.Blending.Upload/**/*"

# =========================================================
# DEPLOY — MANUAL, serializado por Function (resource_group)
# Solo aparece si hubo cambios en esa Function.
# =========================================================

deploy-auth:
  <<: *deploy_win
  variables: { SERVICE_SLUG: "auth", FUNCTION_APP_NAME: "$FUNCTION_APP_AUTH_NAME" }
  resource_group: "deploy-auth"
  needs: [ "build-auth" ]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      changes: [ "Function.Blending.Auth/**/*" ]

deploy-core:
  <<: *deploy_win
  variables: { SERVICE_SLUG: "core", FUNCTION_APP_NAME: "$FUNCTION_APP_CORE_NAME" }
  resource_group: "deploy-core"
  needs: [ "build-core" ]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      changes: [ "Function.Blending.Core/**/*" ]

deploy-opt:
  <<: *deploy_win
  variables: { SERVICE_SLUG: "opt", FUNCTION_APP_NAME: "$FUNCTION_APP_OPT_NAME" }
  resource_group: "deploy-opt"
  needs: [ "build-opt" ]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      changes: [ "Function.Blending.Opt/**/*" ]

deploy-data:
  <<: *deploy_win
  variables: { SERVICE_SLUG: "data", FUNCTION_APP_NAME: "$FUNCTION_APP_DATA_NAME" }
  resource_group: "deploy-data"
  needs: [ "build-data" ]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      changes: [ "Function.Blending.Upload/**/*" ]
