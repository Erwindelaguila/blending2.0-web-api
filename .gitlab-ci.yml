stages:
  - build
  - test
  - deploy

variables:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_NOLOGO: "true"

cache:
  key: "nuget-${CI_COMMIT_REF_SLUG}"
  paths:
    - .nuget/packages
    - ~/.nuget/packages

# ==============================
# Plantillas (DRY)
# ==============================

.build_template: &build_template
  stage: build
  # ⚠️ Ajusta el tag al runner que quieras usar: "windows" o "mac-runner-local"
  tags: [windows]
  before_script:
    - set -euo pipefail
    - dotnet --version
    - mkdir -p .nuget/packages || true
  script:
    - echo "Compilando ${SERVICE_SLUG}..."
    - dotnet restore ${PROJECT_PATH}
    - dotnet build ${PROJECT_PATH} -c Release --no-restore
    - dotnet publish ${PROJECT_PATH} -c Release -o ./publish/${SERVICE_SLUG} --no-build
    - cd ./publish/${SERVICE_SLUG} && zip -r ../${SERVICE_SLUG}.zip . && cd ../..
  artifacts:
    paths:
      - publish/${SERVICE_SLUG}.zip
    expire_in: 1 day

.test_template: &test_template
  stage: test
  # ⚠️ Ajusta el tag al runner que quieras usar: "windows" o "mac-runner-local"
  tags: [windows]
  script:
    - set -euo pipefail
    - if [ -f "Function.Blending.sln" ]; then
        echo "Ejecutando pruebas de la solución principal...";
        dotnet test Function.Blending.sln --configuration Release --no-build --nologo;
      else
        echo "No se encontró Function.Blending.sln. Omitiendo pruebas.";
      fi

.deploy_template: &deploy_template
  stage: deploy
  # ⚠️ Ajusta el tag al runner que quieras usar: "windows" o "mac-runner-local"
  tags: [windows]
  timeout: 30m
  retry: 2
  environment:
    name: production
  before_script:
    - set -euo pipefail
    - if ! command -v az &> /dev/null; then echo "Instalando Azure CLI..."; brew update && brew install azure-cli || true; fi
    - az version
    - az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
    - az account set --subscription "$AZURE_SUBSCRIPTION_ID"
  script:
    - echo "Desplegando ${SERVICE_SLUG} a ${FUNCTION_APP_NAME}..."
    - az functionapp deployment source config-zip \
        -g "$AZURE_RESOURCE_GROUP" \
        -n "${FUNCTION_APP_NAME}" \
        --src ./publish/${SERVICE_SLUG}.zip \
        --timeout 1800

# ==============================
# Jobs de BUILD (solo se disparan si hay cambios)
# ==============================

build-auth:
  <<: *build_template
  variables:
    SERVICE_SLUG: "auth"
    PROJECT_PATH: "Function.Blending.Auth/Function.Blending.Auth.csproj"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - Function.Blending.Auth/**/*

build-core:
  <<: *build_template
  variables:
    SERVICE_SLUG: "core"
    PROJECT_PATH: "Function.Blending.Core/Function.Blending.Core.csproj"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - Function.Blending.Core/**/*

build-opt:
  <<: *build_template
  variables:
    SERVICE_SLUG: "opt"
    PROJECT_PATH: "Function.Blending.Opt/Function.Blending.Opt.csproj"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - Function.Blending.Opt/**/*

build-data:
  <<: *build_template
  variables:
    SERVICE_SLUG: "data"
    PROJECT_PATH: "Function.Blending.Upload/Function.Blending.Upload.csproj"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - Function.Blending.Upload/**/*

# ==============================
# Job de TEST (corre si hay cambios en cualquiera)
# ==============================
test-solution:
  <<: *test_template
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - Function.Blending.Auth/**/*
        - Function.Blending.Core/**/*
        - Function.Blending.Opt/**/*
        - Function.Blending.Upload/**/*

# ==============================
# Jobs de DEPLOY (manual, con resource_group)
# ==============================

deploy-auth:
  <<: *deploy_template
  variables:
    SERVICE_SLUG: "auth"
    FUNCTION_APP_NAME: "$FUNCTION_APP_AUTH_NAME"
  resource_group: "deploy-auth"
  needs: ["build-auth"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      changes:
        - Function.Blending.Auth/**/*

deploy-core:
  <<: *deploy_template
  variables:
    SERVICE_SLUG: "core"
    FUNCTION_APP_NAME: "$FUNCTION_APP_CORE_NAME"
  resource_group: "deploy-core"
  needs: ["build-core"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      changes:
        - Function.Blending.Core/**/*

deploy-opt:
  <<: *deploy_template
  variables:
    SERVICE_SLUG: "opt"
    FUNCTION_APP_NAME: "$FUNCTION_APP_OPT_NAME"
  resource_group: "deploy-opt"
  needs: ["build-opt"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      changes:
        - Function.Blending.Opt/**/*

deploy-data:
  <<: *deploy_template
  variables:
    SERVICE_SLUG: "data"
    FUNCTION_APP_NAME: "$FUNCTION_APP_DATA_NAME"
  resource_group: "deploy-data"
  needs: ["build-data"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      changes:
        - Function.Blending.Upload/**/*
