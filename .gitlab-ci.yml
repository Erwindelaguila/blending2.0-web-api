stages:
  - deploy

variables:
  AZURE_RESOURCE_GROUP: "rg_eastus_tasa_blending2"  

# ==============================
# Deploy All Functions - Like GitHub Actions
# ==============================
deploy-all:
  stage: deploy
  tags: [mac-runner-local]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:                           # ← AUTOMÁTICO como GitHub
        - Function.Blending.Auth/**/*
        - Function.Blending.Core/**/*
        - Function.Blending.Opt/**/*
        - Function.Blending.Upload/**/*
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - set -euo pipefail
    - if ! command -v dotnet &> /dev/null; then brew install dotnet; fi
    - if ! command -v az &> /dev/null; then brew install azure-cli; fi
  script:
    # Check changes and deploy only modified functions
    - echo "🔍 Checking for changes in each function..."
    
    # Deploy Auth Function (if changed)
    - |
      if git diff --name-only HEAD~1 HEAD | grep -q "Function.Blending.Auth/" || [ "$CI_PIPELINE_SOURCE" = "web" ]; then
        echo "📁 Changes detected in Function.Blending.Auth - Deploying..."
        echo "🔨 Building Function.Blending.Auth..."
        dotnet restore Function.Blending.Auth/Function.Blending.Auth.csproj
        dotnet build Function.Blending.Auth/Function.Blending.Auth.csproj -c Release --no-restore
        dotnet publish Function.Blending.Auth/Function.Blending.Auth.csproj -c Release -o ./publish/auth --no-build
        echo "📦 Creating zip for Auth..."
        cd ./publish/auth && zip -r ../auth.zip . && cd ../..
        echo "🚀 Deploying Auth to func-blending2-auth-prod..."
        az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
        az account set --subscription "$AZURE_SUBSCRIPTION_ID"
        az functionapp deployment source config-zip -g "$AZURE_RESOURCE_GROUP" -n "func-blending2-auth-prod" --src ./publish/auth.zip --timeout 600
        echo "✅ Auth deployment completed!"
      else
        echo "⏭️ No changes in Function.Blending.Auth - Skipping..."
      fi

    # Deploy Core Function (if changed)
    - |
      if git diff --name-only HEAD~1 HEAD | grep -q "Function.Blending.Core/" || [ "$CI_PIPELINE_SOURCE" = "web" ]; then
        echo "📁 Changes detected in Function.Blending.Core - Deploying..."
        echo "🔨 Building Function.Blending.Core..."
        dotnet restore Function.Blending.Core/Function.Blending.Core.csproj
        dotnet build Function.Blending.Core/Function.Blending.Core.csproj -c Release --no-restore
        dotnet publish Function.Blending.Core/Function.Blending.Core.csproj -c Release -o ./publish/core --no-build
        echo "📦 Creating zip for Core..."
        cd ./publish/core && zip -r ../core.zip . && cd ../..
        echo "🚀 Deploying Core to func-blending2-core-prod..."
        az functionapp deployment source config-zip -g "$AZURE_RESOURCE_GROUP" -n "func-blending2-core-prod" --src ./publish/core.zip --timeout 600
        echo "✅ Core deployment completed!"
      else
        echo "⏭️ No changes in Function.Blending.Core - Skipping..."
      fi

    # Deploy Opt Function (if changed)
    - |
      if git diff --name-only HEAD~1 HEAD | grep -q "Function.Blending.Opt/" || [ "$CI_PIPELINE_SOURCE" = "web" ]; then
        echo "� Changes detected in Function.Blending.Opt - Deploying..."
        echo "�🔨 Building Function.Blending.Opt..."
        dotnet restore Function.Blending.Opt/Function.Blending.Opt.csproj
        dotnet build Function.Blending.Opt/Function.Blending.Opt.csproj -c Release --no-restore
        dotnet publish Function.Blending.Opt/Function.Blending.Opt.csproj -c Release -o ./publish/opt --no-build
        echo "📦 Creating zip for Opt..."
        cd ./publish/opt && zip -r ../opt.zip . && cd ../..
        echo "🚀 Deploying Opt to func-blending2-opt-prod..."
        az functionapp deployment source config-zip -g "$AZURE_RESOURCE_GROUP" -n "func-blending2-opt-prod" --src ./publish/opt.zip --timeout 600
        echo "✅ Opt deployment completed!"
      else
        echo "⏭️ No changes in Function.Blending.Opt - Skipping..."
      fi

    # Deploy Data Function (if changed)
    - |
      if git diff --name-only HEAD~1 HEAD | grep -q "Function.Blending.Upload/" || [ "$CI_PIPELINE_SOURCE" = "web" ]; then
        echo "📁 Changes detected in Function.Blending.Upload - Deploying..."
        echo "🔨 Building Function.Blending.Upload (Data)..."
        dotnet restore Function.Blending.Upload/Function.Blending.Upload.csproj
        dotnet build Function.Blending.Upload/Function.Blending.Upload.csproj -c Release --no-restore
        dotnet publish Function.Blending.Upload/Function.Blending.Upload.csproj -c Release -o ./publish/data --no-build
        echo "📦 Creating zip for Data..."
        cd ./publish/data && zip -r ../data.zip . && cd ../..
        echo "🚀 Deploying Data to func-blending2-data-prod..."
        az functionapp deployment source config-zip -g "$AZURE_RESOURCE_GROUP" -n "func-blending2-data-prod" --src ./publish/data.zip --timeout 600
        echo "✅ Data deployment completed!"
      else
        echo "⏭️ No changes in Function.Blending.Upload - Skipping..."
      fi
    
    - echo "🎉 Deployment process completed!"
