name: Deploy Functions (Monorepo Ordered)

on:
  push:
    branches:
      - blending-core-develop
    paths:
      - 'Function.Blending.Core/**'
      - 'Function.Blending.Auth/**'
      - 'Function.Blending.Opt/**'
      - 'Function.Blending.Upload/**'

jobs:
  # Detecta qué carpetas cambiaron
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.changes.outputs.core }}
      auth: ${{ steps.changes.outputs.auth }}
      opt: ${{ steps.changes.outputs.opt }}
      upload: ${{ steps.changes.outputs.upload }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            core:
              - 'Function.Blending.Core/**'
            auth:
              - 'Function.Blending.Auth/**'
            opt:
              - 'Function.Blending.Opt/**'
            upload:
              - 'Function.Blending.Upload/**'

  # ==============================
  # 1. Deploy Function Auth
  # ==============================
  deploy-auth:
    needs: changes
    if: ${{ needs.changes.outputs.auth == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore Function.Blending.Auth/Function.Blending.Auth.csproj
      - run: dotnet build Function.Blending.Auth/Function.Blending.Auth.csproj -c Release --no-restore
      - run: dotnet publish Function.Blending.Auth/Function.Blending.Auth.csproj -c Release -o ./publish/auth --no-build
      - uses: azure/functions-action@v4
        with:
          app-name: ${{ vars.AZURE_FUNC_AUTH_NAME }}
          package: './publish/auth'
          publish-profile: ${{ secrets.AZURE_FUNC_AUTH_PUBLISH_PROFILE }}

  # ==============================
  # 2. Deploy Function Core
  # ==============================
  deploy-core:
    needs: deploy-auth
    if: ${{ needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore Function.Blending.Core/Function.Blending.Core.csproj
      - run: dotnet build Function.Blending.Core/Function.Blending.Core.csproj -c Release --no-restore
      - run: dotnet publish Function.Blending.Core/Function.Blending.Core.csproj -c Release -o ./publish/core --no-build
      - uses: azure/functions-action@v4
        with:
          app-name: ${{ vars.AZURE_FUNC_CORE_NAME }}
          package: './publish/core'
          publish-profile: ${{ secrets.AZURE_FUNC_CORE_PUBLISH_PROFILE }}

  # ==============================
  # 3. Deploy Function Opt
  # ==============================
  deploy-opt:
    needs: deploy-core
    if: ${{ needs.changes.outputs.opt == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore Function.Blending.Opt/Function.Blending.Opt.csproj
      - run: dotnet build Function.Blending.Opt/Function.Blending.Opt.csproj -c Release --no-restore
      - run: dotnet publish Function.Blending.Opt/Function.Blending.Opt.csproj -c Release -o ./publish/opt --no-build
      - uses: azure/functions-action@v4
        with:
          app-name: ${{ vars.AZURE_FUNC_OPT_NAME }}
          package: './publish/opt'
          publish-profile: ${{ secrets.AZURE_FUNC_OPT_PUBLISH_PROFILE }}

  # ==============================
  # 4. Deploy Function Upload
  # ==============================
  deploy-upload:
    needs: deploy-opt
    if: ${{ needs.changes.outputs.upload == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore Function.Blending.Upload/Function.Blending.Upload.csproj
      - run: dotnet build Function.Blending.Upload/Function.Blending.Upload.csproj -c Release --no-restore
      - run: dotnet publish Function.Blending.Upload/Function.Blending.Upload.csproj -c Release -o ./publish/upload --no-build
      - uses: azure/functions-action@v4
        with:
          app-name: ${{ vars.AZURE_FUNC_UPLOAD_NAME }}
          package: './publish/upload'
          publish-profile: ${{ secrets.AZURE_FUNC_UPLOAD_PUBLISH_PROFILE }}
